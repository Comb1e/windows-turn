[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboard-hinge"
version = "0.7.0"
description = "Laptop hinge angle estimation from annotated keyboard photos, with optional camera calibration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
keyboard-hinge = "keyboard_hinge.cli:main"

[tool.setuptools.packages.find]
include = ["keyboard_hinge*"]

[tool.setuptools.package-data]
keyboard_hinge = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
